<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>My Unity Game</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="/static/app/Build/app.loader.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: black;
      overflow: hidden;
      height: 100%;
    }

    #unity-canvas {
      width: 100%;
      height: 100%;
      background: black;
      display: block;
    }
  </style>
</head>

<body>
  <canvas id="unity-canvas"></canvas>

  <script>
    const canvas = document.getElementById("unity-canvas");

    createUnityInstance(canvas, {
      dataUrl: "/static/app/Build/app.data",
      frameworkUrl: "/static/app/Build/app.framework.js",
      codeUrl: "/static/app/Build/app.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "MyCompany",
      productName: "MyGame",
      productVersion: "1.0"
    }).then((unityInstance) => {

      console.log("Unity запущен");

      // ===== Telegram WebApp =====
      if (window.Telegram && window.Telegram.WebApp) {
        const tg = window.Telegram.WebApp;
        tg.ready();

        const userId = tg.initDataUnsafe?.user?.id;

        if (userId) {
          console.log("Telegram user ID:", userId);

          // ❗ ИМЯ GAMEOBJECT, А НЕ СКРИПТА
          unityInstance.SendMessage(
            "Canvas",              // ← имя объекта в сцене
            "SetPlayerId",          // метод в PauseMenuController
            userId.toString()
          );
        } else {
          console.warn("Telegram user.id не найден");
        }
      } else {
        console.warn("Telegram WebApp не обнаружен (запуск вне Telegram)");
      }

    }).catch((err) => {
      console.error("Ошибка запуска Unity:", err);
      alert("Ошибка запуска Unity");
    });
  </script>
</body>
</html>
