<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>My Unity Game</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="/static/app/Build/app.loader.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: black;
      overflow: hidden;
      height: 100%;
    }
    #unity-canvas {
      width: 100%;
      height: 100%;
      background: black;
      display: block;
    }
  </style>
</head>
<body>
  <canvas id="unity-canvas"></canvas>

  <script>
    const canvas = document.getElementById("unity-canvas");

    createUnityInstance(canvas, {
      dataUrl: "/static/app/Build/app.data",
      frameworkUrl: "/static/app/Build/app.framework.js",
      codeUrl: "/static/app/Build/app.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "MyCompany",
      productName: "MyGame",
      productVersion: "1.0"
    }).then((unityInstance) => {
      console.log("Unity запущен!");

      // Telegram Web App
      if (window.Telegram && window.Telegram.WebApp) {
        window.Telegram.WebApp.ready();

        let userId = window.Telegram.WebApp.initDataUnsafe?.user?.id;
        if (userId) {
          console.log("Telegram user ID:", userId);
          unityInstance.SendMessage("PauseMenuController", "SetPlayerId", userId.toString());
        } else {
          console.warn("Не удалось получить user.id из Telegram");
        }
      } else {
        console.warn("Telegram WebApp не найден. Игрок будет без ID!");
      }

    }).catch((message) => {
      alert("Ошибка запуска Unity: " + message);
      console.error(message);
    });
  </script>
</body>
</html>
