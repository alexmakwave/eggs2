<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>My Unity Game</title>
  
  <!-- ВАЖНО: Подключаем API Телеграма -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="/static/app/Build/app.loader.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: black;
      overflow: hidden;
      height: 100%;
    }
    #unity-canvas {
      width: 100%;
      height: 100%;
      background: black;
      display: block;
    }
  </style>
</head>
<body>
  <canvas id="unity-canvas"></canvas>

  <script>
    const canvas = document.getElementById("unity-canvas");

    createUnityInstance(canvas, {
      dataUrl: "/static/app/Build/app.data",
      frameworkUrl: "/static/app/Build/app.framework.js",
      codeUrl: "/static/app/Build/app.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "MyCompany",
      productName: "MyGame",
      productVersion: "1.0"
    }).then((unityInstance) => {
      console.log("Unity запущен!");

      let playerId = null;

      // ===== 1. Пробуем получить через Telegram Web App =====
      if (window.Telegram && window.Telegram.WebApp) {
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand(); // Разворачиваем приложение

        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
          playerId = tg.initDataUnsafe.user.id;
          console.log("ID получен из Telegram WebApp:", playerId);
        }
      }

      // ===== 2. Fallback: если ID нет, ищем в URL (для тестов) =====
      if (!playerId) {
        const urlParams = new URLSearchParams(window.location.search);
        const urlId = urlParams.get("player_id");
        if (urlId && urlId !== "{id}") { // Игнорируем текст "{id}"
            playerId = urlId;
            console.log("ID получен из URL:", playerId);
        }
      }

      // ===== 3. Отправка в Unity =====
      if (playerId) {
        // УБЕДИТЕСЬ, ЧТО В UNITY ОБЪЕКТ НАЗЫВАЕТСЯ "Canvas"
        unityInstance.SendMessage("Canvas", "SetPlayerId", playerId.toString());
      } else {
        console.warn("Player ID не найден. Проверьте запуск через Telegram.");
        // Можно показать alert для отладки:
        // alert("ID не найден! Зайдите через бота.");
      }

    }).catch((err) => {
      console.error("Ошибка запуска Unity:", err);
      alert("Ошибка запуска Unity: " + err);
    });
  </script>
</body>
</html>
