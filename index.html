<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>My Unity Game</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="/static/app/Build/app.loader.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: black;
      overflow: hidden;
      height: 100%;
    }
    #unity-canvas {
      width: 100%;
      height: 100%;
      background: black;
      display: block;
    }
  </style>
</head>
<body>
  <canvas id="unity-canvas"></canvas>

  <script>
    const canvas = document.getElementById("unity-canvas");

    createUnityInstance(canvas, {
      dataUrl: "/static/app/Build/app.data",
      frameworkUrl: "/static/app/Build/app.framework.js",
      codeUrl: "/static/app/Build/app.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "MyCompany",
      productName: "MyGame",
      productVersion: "1.0"
    }).then((unityInstance) => {
      console.log("Unity запущен!");

      let playerId = null;

      // ===== Telegram Web App =====
      if (window.Telegram && window.Telegram.WebApp) {
        const tg = window.Telegram.WebApp;
        tg.onEvent("themeChanged", () => {}); // активация WebApp
        tg.ready();

        // Пробуем получить ID пользователя через Telegram
        playerId = tg.initDataUnsafe?.user?.id;
      }

      // ===== fallback: читаем player_id из URL =====
      if (!playerId) {
        const urlParams = new URLSearchParams(window.location.search);
        playerId = urlParams.get("player_id");
      }

      if (playerId) {
        console.log("Player ID найден:", playerId);
        // ❗ Имя GameObject, на котором висит PauseMenuController
        unityInstance.SendMessage("Canvas", "SetPlayerId", playerId.toString());
      } else {
        console.warn("Player ID не найден ни через WebApp, ни в URL. Игра запущена без ID.");
      }

    }).catch((err) => {
      console.error("Ошибка запуска Unity:", err);
      alert("Ошибка запуска Unity");
    });
  </script>
</body>
</html>
